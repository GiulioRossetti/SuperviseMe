<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="t d">
  <title id="t">SuperviseMe</title>
  <desc id="d">Thesis supervision and research project management: a supervisor connected to students and research outputs, with milestones, agenda and publications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#c7d2fe" fill-opacity="0.14"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/></filter>
    <clipPath id="round"><rect width="1600" height="500" rx="0"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .card { fill: #ffffff; fill-opacity: 0.09; stroke: #c7d2fe; stroke-opacity: 0.35; stroke-width: 1.5; }
    .edge { stroke: #c7d2fe; stroke-opacity: 0.38; stroke-width: 2; fill: none; }
    .small { font-size: 13px; fill: #e0e7ff; fill-opacity: 0.85; }
    .chip { fill: #ffffff; fill-opacity: 0.1; stroke: #c7d2fe; stroke-opacity: 0.4; }
    .chiptx { font-size: 17px; fill: #e0e7ff; font-weight: 600; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1600" height="500" fill="url(#bg)"/>
    <rect width="1600" height="500" fill="url(#dots)"/>
    <ellipse cx="1190" cy="250" rx="420" ry="330" fill="url(#glow)"/>
    <ellipse cx="260" cy="470" rx="420" ry="220" fill="url(#glow2)"/>

    <!-- ===== left: identity ===== -->
    <g transform="translate(90,92)">
      <rect width="400" height="34" rx="17" fill="#ffffff" fill-opacity="0.1" stroke="#c7d2fe" stroke-opacity="0.4"/>
      <text x="20" y="22.5" font-size="13.5" font-weight="700" letter-spacing="2.2" fill="#c7d2fe">THESES  ·  RESEARCH  ·  COLLABORATION</text>
    </g>
    <!-- mark -->
    <g transform="translate(90,162)" filter="url(#shadow)">
      <rect width="92" height="92" rx="24" fill="#ffffff" fill-opacity="0.12" stroke="#c7d2fe" stroke-opacity="0.5" stroke-width="1.5"/>
      <polygon points="46,22 80,38 46,54 12,38" fill="url(#accent)"/>
      <path d="M28 47 V60 C28 66 37 71 46 71 C55 71 64 66 64 60 V47 L46 55 Z" fill="#e0e7ff" fill-opacity="0.92"/>
      <line x1="80" y1="38" x2="80" y2="62" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="65" r="4.5" fill="#67e8f9"/>
    </g>
    <text x="204" y="236" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff">Supervise<tspan fill="url(#accent)">Me</tspan></text>
    <text x="92" y="312" font-size="32" font-weight="500" fill="#e0e7ff">Thesis supervision and research project</text>
    <text x="92" y="354" font-size="32" font-weight="500" fill="#e0e7ff">management for academic environments.</text>
    <g transform="translate(90,396)">
      <rect class="chip" width="146" height="40" rx="20"/><text class="chiptx" x="73" y="26" text-anchor="middle">Workflow</text>
      <rect class="chip" x="158" width="146" height="40" rx="20"/><text class="chiptx" x="231" y="26" text-anchor="middle">Milestones</text>
      <rect class="chip" x="316" width="146" height="40" rx="20"/><text class="chiptx" x="389" y="26" text-anchor="middle">Research</text>
      <rect class="chip" x="474" width="146" height="40" rx="20"/><text class="chiptx" x="547" y="26" text-anchor="middle">Agenda</text>
    </g>

    <!-- ===== right: supervision network ===== -->
    <!-- milestone path -->
    <path d="M820 440 C 940 470, 1030 400, 1110 330 S 1290 200, 1530 70" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- edges -->
    <g class="edge">
      <line x1="1190" y1="250" x2="1030" y2="190"/><line x1="1190" y1="250" x2="985" y2="305"/><line x1="1190" y1="250" x2="1120" y2="398"/>
      <line x1="1190" y1="250" x2="1400" y2="185"/><line x1="1190" y1="250" x2="1445" y2="300"/><line x1="1190" y1="250" x2="1305" y2="392"/>
      <line x1="1030" y1="190" x2="985" y2="305" stroke-dasharray="4 6"/><line x1="1400" y1="185" x2="1445" y2="300" stroke-dasharray="4 6"/>
    </g>

    <!-- students -->
    <g>
      <g transform="translate(1030,190)"><circle r="30" fill="#312e81" stroke="#a5b4fc" stroke-width="2.5"/><circle cy="-6" r="9" fill="#e0e7ff"/><path d="M-16 20 C-14 8 14 8 16 20 Z" fill="#e0e7ff"/></g>
      <g transform="translate(985,305)"><circle r="30" fill="#312e81" stroke="#a5b4fc" stroke-width="2.5"/><circle cy="-6" r="9" fill="#e0e7ff"/><path d="M-16 20 C-14 8 14 8 16 20 Z" fill="#e0e7ff"/></g>
      <g transform="translate(1120,398)"><circle r="27" fill="#312e81" stroke="#a5b4fc" stroke-width="2.5"/><circle cy="-5" r="8" fill="#e0e7ff"/><path d="M-14 18 C-12 7 12 7 14 18 Z" fill="#e0e7ff"/></g>
    </g>

    <!-- supervisor (centre) -->
    <g transform="translate(1190,250)" filter="url(#shadow)">
      <circle r="62" fill="#4f46e5" fill-opacity="0.35"/>
      <circle r="50" fill="#4338ca" stroke="#c7d2fe" stroke-width="3"/>
      <circle cy="-10" r="14" fill="#ffffff"/><path d="M-26 30 C-22 10 22 10 26 30 Z" fill="#ffffff"/>
      <polygon points="0,-44 22,-34 0,-24 -22,-34" fill="#67e8f9"/>
    </g>

    <!-- research outputs (hexagons) -->
    <g>
      <g transform="translate(1400,185)"><polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="#0e7490" fill-opacity="0.55" stroke="#67e8f9" stroke-width="2.5"/>
        <rect x="-12" y="-14" width="24" height="28" rx="3" fill="none" stroke="#cffafe" stroke-width="2.2"/><line x1="-6" y1="-5" x2="6" y2="-5" stroke="#cffafe" stroke-width="2.2"/><line x1="-6" y1="2" x2="6" y2="2" stroke="#cffafe" stroke-width="2.2"/><line x1="-6" y1="9" x2="2" y2="9" stroke="#cffafe" stroke-width="2.2"/></g>
      <g transform="translate(1445,300)"><polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="#0e7490" fill-opacity="0.55" stroke="#67e8f9" stroke-width="2.5"/>
        <ellipse cy="-9" rx="13" ry="5" fill="none" stroke="#cffafe" stroke-width="2.2"/><path d="M-13 -9 V9 C-13 14 13 14 13 9 V-9" fill="none" stroke="#cffafe" stroke-width="2.2"/><path d="M-13 0 C-13 5 13 5 13 0" fill="none" stroke="#cffafe" stroke-width="2.2"/></g>
      <g transform="translate(1305,392)"><polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="#0e7490" fill-opacity="0.55" stroke="#67e8f9" stroke-width="2.5"/>
        <path d="M-6 -12 L-15 0 L-6 12 M6 -12 L15 0 L6 12" fill="none" stroke="#cffafe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    </g>

    <!-- floating cards -->
    <g transform="translate(1150,52)" filter="url(#shadow)">
      <rect class="card" width="236" height="68" rx="14"/>
      <text class="small" x="18" y="26" font-weight="700">Milestone · Draft chapter 3</text>
      <rect x="18" y="38" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.15"/>
      <rect x="18" y="38" width="144" height="10" rx="5" fill="url(#bar)"/>
      <text class="small" x="18" y="62" font-size="11.5">72% complete · due in 5 days</text>
    </g>
    <g transform="translate(1360,402)" filter="url(#shadow)">
      <rect class="card" width="156" height="72" rx="14"/>
      <text class="small" x="16" y="24" font-weight="700">Meeting · Thu 10:30</text>
      <g fill="#ffffff" fill-opacity="0.16">
        <rect x="16" y="34" width="18" height="14" rx="3"/><rect x="38" y="34" width="18" height="14" rx="3"/><rect x="60" y="34" width="18" height="14" rx="3"/>
        <rect x="82" y="34" width="18" height="14" rx="3" fill="#67e8f9" fill-opacity="0.9"/><rect x="104" y="34" width="18" height="14" rx="3"/><rect x="126" y="34" width="14" height="14" rx="3"/>
        <rect x="16" y="52" width="18" height="10" rx="3"/><rect x="38" y="52" width="18" height="10" rx="3"/><rect x="60" y="52" width="18" height="10" rx="3"/>
      </g>
    </g>
    <g transform="translate(860,360)" filter="url(#shadow)">
      <rect class="card" width="176" height="86" rx="14"/>
      <text class="small" x="16" y="26" font-weight="700">Publication</text>
      <rect x="16" y="36" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="16" y="50" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="16" y="64" width="46" height="14" rx="7" fill="#22d3ee" fill-opacity="0.85"/><text x="39" y="74.5" font-size="9.5" font-weight="800" fill="#083344" text-anchor="middle">DOI</text>
      <rect x="68" y="64" width="62" height="14" rx="7" fill="#a5b4fc" fill-opacity="0.8"/><text x="99" y="74.5" font-size="9.5" font-weight="800" fill="#1e1b4b" text-anchor="middle">ORCID</text>
    </g>
  </g>
</svg>
