<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="200" height="200" rx="40" fill="#1e1b4b"/>

  <!-- Outer ring arc — supervisor side (top-left) -->
  <path d="M 58 100 A 42 42 0 1 1 100 58" stroke="url(#g1)" stroke-width="10"
        stroke-linecap="round" fill="none"/>

  <!-- Inner ring arc — student side (bottom-right) -->
  <path d="M 142 100 A 42 42 0 1 1 100 142" stroke="#6366f1" stroke-width="10"
        stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Center node — the connection point -->
  <circle cx="100" cy="100" r="14" fill="url(#g2)"/>
  <circle cx="100" cy="100" r="7" fill="#4f46e5"/>

  <!-- Top node (supervisor) -->
  <circle cx="100" cy="58" r="8" fill="url(#g1)"/>

  <!-- Right node (student) -->
  <circle cx="142" cy="100" r="8" fill="#6366f1" opacity="0.65"/>

  <!-- Accent dot — amber -->
  <circle cx="58" cy="100" r="5" fill="#fbbf24"/>
  <circle cx="100" cy="142" r="5" fill="#fbbf24" opacity="0.7"/>
</svg>
