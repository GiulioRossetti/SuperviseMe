name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      FLASK_ENV: development
      SECRET_KEY: ci-secret-key
      ADMIN_BOOTSTRAP_PASSWORD: ci-bootstrap-password
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (runtime-safety rules)
        run: |
          ruff check --select E9,F63,F7,F82,F811,B006,B008 superviseme scripts

      - name: Python compile checks
        run: |
          python -m py_compile superviseme/__init__.py superviseme/routes/*.py superviseme/utils/*.py scripts/*.py

      - name: Schema alignment check
        run: |
          python scripts/check_schema_alignment.py --db data_schema/database_dashboard.db --strict

      - name: Migration check (upgrade on ephemeral DB)
        run: |
          FLASK_APP=superviseme.py FLASK_SKIP_USER_INIT=true SQLALCHEMY_DATABASE_URI="sqlite:////tmp/superviseme_ci_migrate.db" flask db upgrade

      - name: Tests
        run: |
          pytest -q

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superviseme
          POSTGRES_PASSWORD: superviseme
          POSTGRES_DB: superviseme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superviseme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: development
      SECRET_KEY: ci-secret-key
      ADMIN_BOOTSTRAP_PASSWORD: ci-bootstrap-password
      ENABLE_SCHEDULER: "false"
      PG_USER: superviseme
      PG_PASSWORD: superviseme
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DBNAME: superviseme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations on PostgreSQL
        run: |
          python - <<'PY'
          from flask_migrate import upgrade
          from sqlalchemy import inspect
          from superviseme import create_app, db

          app = create_app(db_type="postgresql", skip_user_init=True)
          with app.app_context():
              upgrade()
              tables = inspect(db.engine).get_table_names()
              assert "user_mgmt" in tables and "research_project" in tables, tables
              print(f"OK: {len(tables)} tables after migrations")
          PY

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
