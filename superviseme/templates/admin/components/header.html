<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}">

    <title>SuperviseMe — {{ (current_user.user_type | title) if current_user.is_authenticated else _('Public') }}</title>

    <!-- Custom fonts for this template-->
    <link href="{{ url_for('static', filename='assets/js/vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />

    <!-- Custom styles for this template-->
    <link href="{{ url_for('static', filename='assets/css/sb-admin-2.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='assets/css/meeting-notes.css') }}" rel="stylesheet">
    
    <!-- DataTables -->
    <link href="{{ url_for('static', filename='assets/js/vendor/datatables/dataTables.bootstrap4.min.css') }}" rel="stylesheet">
    <!-- SuperviseMe modern UI override -->
    <link href="{{ url_for('static', filename='assets/css/superviseme.css') }}" rel="stylesheet">


    <!-- Sidebar early-paint: apply collapsed class before first render to avoid flash -->
    <script>
    (function() {
        try {
            if (localStorage.getItem('sm_sidebar_collapsed') === '1') {
                document.documentElement.classList.add('sidebar-preload-collapsed');
            }
        } catch(e) {}
    })();
    </script>
    <style>
    /* Applied by early-paint script above; avoids layout shift on page load */
    .sidebar-preload-collapsed #accordionSidebar,
    .sidebar-preload-collapsed #wrapper .sidebar { width: 6.5rem !important; }
    </style>

</head>
