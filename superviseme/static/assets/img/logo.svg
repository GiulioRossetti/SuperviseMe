<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <!-- Board — flat horizontal rhombus -->
  <path d="M100 54 L162 82 L100 110 L38 82 Z" fill="white" opacity="0.95"/>
  <!-- Right face of cap -->
  <path d="M162 82 L162 100 L100 128 L100 110 Z" fill="url(#accent)" opacity="0.85"/>
  <!-- Left face hidden / subtle -->
  <path d="M38 82 L38 100 L100 128 L100 110 Z" fill="white" opacity="0.25"/>
  <!-- Tassel rope -->
  <line x1="162" y1="82" x2="162" y2="112" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <!-- Tassel dot -->
  <circle cx="162" cy="119" r="7" fill="#fbbf24"/>
  <!-- Diploma line 1 -->
  <rect x="72" y="145" width="56" height="5" rx="2.5" fill="white" opacity="0.55"/>
  <!-- Diploma line 2 -->
  <rect x="80" y="156" width="40" height="4" rx="2" fill="white" opacity="0.35"/>
</svg>
